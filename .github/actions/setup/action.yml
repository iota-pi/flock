name: Set up Node and dependencies
description: Enable corepack, set up Node with the Yarn cache and install dependencies

inputs:
  cypress-binary:
    description: Whether to download the Cypress binary during install
    default: 'false'

runs:
  using: composite
  steps:
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: yarn
    - run: yarn install --immutable
      shell: bash
      env:
        CYPRESS_INSTALL_BINARY: ${{ inputs.cypress-binary != 'true' && '0' || '' }}
