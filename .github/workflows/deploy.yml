name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # 1. Test the merged commit
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  # 2. Build the site once, with no secrets: this job runs the build tools and their dependencies, so
  # it must never hold deploy credentials. Staging and production ship exactly what it produces.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - run: yarn vite build
        env:
          VITE_RELEASE: ${{ github.sha }}

      # Needs no credentials. It changes the JS, which has to match the maps sent to Sentry.
      - run: yarn sentry-cli sourcemaps inject dist/app

      - name: Keep source maps out of the site
        run: |
          cp -r dist/app dist/sourcemaps
          find dist/app -name '*.map' -delete

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app
          path: dist/app
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sourcemaps
          path: dist/sourcemaps
          if-no-files-found: error
          retention-days: 30

  # 3. Deploy to Staging and run Cypress against it. The group spans both jobs of the called
  # workflow, so another run can't deploy over this build before its tests finish.
  staging:
    name: Staging
    needs: [test, build]
    concurrency:
      group: staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/staging.yml
    secrets: inherit

  # 4. Deploy to Production
  deploy-production:
    name: Deploy to Production
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: dist/app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sourcemaps
          path: dist/sourcemaps

      # Before the deploy, so the new version's first errors are readable. A Sentry outage shouldn't
      # hold up a release.
      - run: yarn sentry-cli sourcemaps upload dist/sourcemaps
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}

      - run: yarn deploy --stage production --print-logs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
