name: Deploy

on:
  push:
    branches: [master]

# One deploy at a time, so Cypress always tests the build its run deployed to staging
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # 1. Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}

      - run: yarn deploy --stage staging --print-logs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # 2. Run E2E Tests against Staging
  e2e-staging:
    name: Cypress on Staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - uses: ./.github/actions/setup
        with:
          cypress-binary: 'true'
      - uses: cypress-io/github-action@v7
        with:
          install: false
          browser: chrome
        env:
          CYPRESS_BASE_URL: https://flock-staging.cross-code.org

      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  # 3. Deploy to Production
  deploy-production:
    name: Deploy to Production
    needs: e2e-staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}

      - run: yarn deploy --stage production --print-logs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
