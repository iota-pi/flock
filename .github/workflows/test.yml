name: CI

on:
  pull_request:
  # Deploy runs this on master before deploying
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # Deploy runs are already serialised, and a newer push must not cancel an older run's tests
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The image runs in memory by default. Tests expect it where `docker compose` puts
      # `dynamodb-test`, and create its tables themselves.
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8001:8000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run Tests
        run: yarn test run

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn lint
