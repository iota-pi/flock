name: CI

on:
  pull_request:
  # Deploy runs this on master before deploying
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # Deploy runs are already serialised, and a newer push must not cancel an older run's tests
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The image runs in memory by default. Tests expect it where `docker compose` puts
      # `dynamodb-test`, and create its tables themselves.
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8001:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The sync model has a job of its own, so its slow property doesn't hold up everything else
      - name: Run Tests
        run: yarn test run --exclude '**/syncModel.integration.spec.ts'

  sync-model:
    name: Sync Model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8001:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # A fixed seed, so a PR only fails for scenarios that passed on master. The nightly
      # Sync Model Exploration workflow tries new ones.
      - name: Run Sync Model Tests
        run: yarn test:sync-model

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn lint
