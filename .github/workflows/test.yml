name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Initialise database
        run: yarn initdb
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000

      - name: Run Tests
        run: yarn test run

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn lint

  # The master ruleset requires a check with this name
  all:
    name: Test & Lint
    if: ${{ !cancelled() }}
    needs: [test, typecheck, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
