name: CI

on:
  pull_request:
  # Deploy runs this on master before deploying
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # Deploy runs are already serialised, and a newer push must not cancel an older run's tests
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Initialise database
        run: yarn initdb
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000

      - name: Run Tests
        run: yarn test run

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: yarn lint
