nodeLinker: node-modules

# Yarn's default today, stated so a Yarn upgrade can't turn it back on. Packages that need their
# install scripts are allowed one by one with `dependenciesMeta` in package.json.
enableScripts: false

# Compromised releases are usually caught within days, so don't install anything newer than this.
# Keep Dependabot's cooldown at least this long, or its updates can't resolve.
npmMinimalAgeGate: 7d
