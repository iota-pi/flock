services:
  # For `yarn start`: keeps its data in a volume across restarts
  dynamodb:
    image: amazon/dynamodb-local
    command: [ "-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "." ]
    ports:
      - 8000:8000
    volumes:
      - dynamodata:/home/dynamodblocal

  # For tests: in memory, so writes are fast and a restart clears it. The tests create its tables.
  dynamodb-test:
    image: amazon/dynamodb-local
    command: [ "-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory" ]
    ports:
      - 8001:8000

volumes:
  dynamodata:
